<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crash Game</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<h1>💥 Crash</h1>

<div>
Баланс: <span id="balance">0</span>
</div>

<input id="bet" type="number" placeholder="Ставка">

<button onclick="startCrash()">Играть</button>
<button onclick="cashout()">Забрать</button>

<h2 id="multiplier">1.00x</h2>

<script src="app.js"></script>

<script>

let multiplier = 1
let running = false
let bet = 0

function startCrash(){

bet = parseInt(document.getElementById("bet").value)

if(!bet) return

Telegram.WebApp.sendData(JSON.stringify({
action:"start_crash",
bet:bet
}))

running = true
multiplier = 1

crashLoop()

}

function crashLoop(){

if(!running) return

multiplier += 0.01


document.getElementById("multiplier").innerText = multiplier.toFixed(2) + "x"

setTimeout(crashLoop,100)

}

function cashout(){

if(!running) return

running = false

let win = Math.floor(bet * multiplier)

Telegram.WebApp.sendData(JSON.stringify({
action:"cashout_crash",
win:win
}))

}

</script>

</body>
</html>
