<!DOCTYPE html>
<html>
<head>
    <title>Crash Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .balance {
            font-size: 24px;
            margin: 20px;
            color: #00ff88;
        }
        .multiplier {
            font-size: 72px;
            font-weight: bold;
            margin: 40px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            transition: all 0.1s;
        }
        .crashed {
            color: #ff4444;
            font-size: 48px;
            display: none;
        }
        .game-area {
            background: #16213e;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
        }
        .bet-input {
            width: 200px;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            margin: 10px;
            text-align: center;
        }
        .button {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
        }
        .play {
            background: #4CAF50;
            color: white;
        }
        .play:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .cashout {
            background: #FFD700;
            color: black;
            display: none;
        }
        .history {
            margin-top: 20px;
            font-size: 14px;
        }
        .status {
            font-size: 18px;
            margin: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="game-area">
        <h1>💥 CRASH GAME</h1>
        <div class="balance">Баланс: <span id="balance">0</span> монет</div>
        
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="crashed" id="crashed">💥 CRASHED!</div>
        
        <div>
            <input type="number" id="bet" class="bet-input" placeholder="Ставка" min="100" value="1000">
        </div>
        
        <button class="button play" id="playBtn">🎮 ИГРАТЬ</button>
        <button class="button cashout" id="cashoutBtn">💰 ЗАБРАТЬ (1.00x)</button>
        
        <div class="status" id="status"></div>
        <div class="history" id="history"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        let balance = 0;
        let gameActive = false;
        let currentMultiplier = 1.00;
        let gameInterval;
        let crashPoint;
        let currentBet = 0;
        
        // Получаем данные от бота
        tg.onEvent('mainButtonClicked', function() {
            tg.sendData(JSON.stringify({action: 'close'}));
        });
        
        // Инициализация
        tg.ready();
        
        // Запрашиваем баланс
        function requestBalance() {
            tg.sendData(JSON.stringify({action: 'get_balance'}));
        }
        
        // Обновление баланса
        function updateBalance(newBalance) {
            balance = newBalance;
            document.getElementById('balance').innerText = balance.toLocaleString();
        }
        
        // Получение данных от бота
        window.addEventListener('message', function(event) {
            let data = event.data;
            if (data.type === 'balance') {
                updateBalance(data.balance);
            }
        });
        
        // Начать игру
        document.getElementById('playBtn').onclick = function() {
            let bet = parseInt(document.getElementById('bet').value);
            
            if (bet < 100) {
                alert('Минимальная ставка 100 монет!');
                return;
            }
            
            if (bet > balance) {
                alert('Недостаточно средств!');
                return;
            }
            
            currentBet = bet;
            
            // Отправляем ставку в бот
            tg.sendData(JSON.stringify({
                action: 'start_crash',
                bet: bet
            }));
            
            startGame();
        };
        
        function startGame() {
            gameActive = true;
            currentMultiplier = 1.00;
            crashPoint = generateCrashPoint();
            
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('cashoutBtn').style.display = 'inline-block';
            document.getElementById('crashed').style.display = 'none';
            document.getElementById('multiplier').style.color = '#ffd700';
            document.getElementById('status').innerText = 'Игра началась...';
            
            gameInterval = setInterval(function() {
                if (!gameActive) return;
                
                currentMultiplier += 0.01;
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
                document.getElementById('cashoutBtn').innerText = `💰 ЗАБРАТЬ (${currentMultiplier.toFixed(2)}x)`;
                
                if (currentMultiplier >= crashPoint) {
                    crash();
                }
            }, 100);
        }
        
        function generateCrashPoint() {
            // Рандомная точка краша от 1.1 до 10
            return 1.1 + Math.random() * 8.9;
        }
        
        function crash() {
            gameActive = false;
            clearInterval(gameInterval);
            
            document.getElementById('multiplier').style.color = '#ff4444';
            document.getElementById('crashed').style.display = 'block';
            document.getElementById('playBtn').style.display = 'inline-block';
            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('status').innerText = '💥 КРАШ! Ты проиграл ' + currentBet + ' монет';
            
            // Добавляем в историю
            addToHistory('💥 КРАШ', currentBet, 0);
            
            // Обновляем баланс
            requestBalance();
        }
        
        document.getElementById('cashoutBtn').onclick = function() {
            if (!gameActive) return;
            
            gameActive = false;
            clearInterval(gameInterval);
            
            let win = Math.floor(currentBet * currentMultiplier);
            
            // Отправляем выигрыш в бот
            tg.sendData(JSON.stringify({
                action: 'cashout_crash',
                win: win
            }));
            
            document.getElementById('multiplier').style.color = '#00ff88';
            document.getElementById('playBtn').style.display = 'inline-block';
            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('status').innerHTML = `✅ ВЫИГРЫШ: ${win} монет!`;
            
            // Добавляем в историю
            addToHistory('✅ ВЫИГРЫШ', currentBet, win);
            
            // Обновляем баланс
            setTimeout(requestBalance, 500);
        };
        
        function addToHistory(result, bet, win) {
            let historyDiv = document.getElementById('history');
            let historyItem = document.createElement('div');
            historyItem.style.margin = '5px';
            historyItem.style.padding = '5px';
            historyItem.style.borderRadius = '5px';
            historyItem.style.backgroundColor = '#1a1a2e';
            historyItem.innerHTML = `${result} | Ставка: ${bet} | ${win > 0 ? 'Выигрыш: ' + win : 'Проигрыш'}`;
            historyDiv.prepend(historyItem);
            
            // Ограничим историю 10 записями
            if (historyDiv.children.length > 10) {
                historyDiv.removeChild(historyDiv.lastChild);
            }
        }
        
        // Запрашиваем баланс при загрузке
        requestBalance();
    </script>
</body>
</html>
