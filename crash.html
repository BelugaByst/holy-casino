<!DOCTYPE html>
<html>
<head>
    <title>Краш Белуги</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... весь твой CSS ... */
    </style>
</head>
<body>
    <div class="game-container">
        <div class="balance-box">
            <span class="balance-label">Баланс</span>
            <span class="balance-value" id="balance">0₽</span>
        </div>
        
        <!-- ... весь остальной HTML ... -->
    </div>
    
    <div class="notification" id="notification"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        let balance = 0;
        let gameActive = false;
        let currentMultiplier = 1.00;
        let gameInterval;
        let crashPoint;
        let currentBet = 0;
        let winChance = 1.0;
        
        // Инициализация - ЗАПРАШИВАЕМ БАЛАНС
        tg.ready();
        
        // Функция запроса баланса
        function requestBalance() {
            console.log("📱 Запрос баланса...");
            tg.sendData(JSON.stringify({
                action: 'get_balance'
            }));
        }
        
        // Ждем загрузку и запрашиваем баланс
        setTimeout(requestBalance, 500);
        
        // Слушаем ответы от бота
        tg.onEvent('message', function(event) {
            console.log("📩 Получено сообщение:", event);
            try {
                let data = JSON.parse(event);
                
                if (data.type === 'balance') {
                    balance = data.balance;
                    document.getElementById('balance').innerText = balance.toLocaleString() + '₽';
                    console.log("💰 Баланс обновлен:", balance);
                }
            } catch (e) {
                console.log("❌ Ошибка парсинга:", e);
            }
        });
        
        // Установка быстрой ставки
        function setBet(amount) {
            document.getElementById('bet').value = amount;
        }
        
        // Расчет шанса выигрыша
        function calculateWinChance(bet) {
            const baseCrashChance = 0.0575;
            let betMultiplier = Math.min(bet / 10000000, 5);
            let adjustedCrashChance = Math.min(baseCrashChance * (1 + betMultiplier * 0.5), 0.3);
            winChance = 1 - adjustedCrashChance;
            return adjustedCrashChance;
        }
        
        // Показать уведомление
        function showNotification(message, duration, isError = false) {
            let notification = document.getElementById('notification');
            notification.innerText = message;
            notification.classList.remove('error');
            if (isError) {
                notification.classList.add('error');
            }
            notification.classList.add('show');
            
            setTimeout(function() {
                notification.classList.remove('show');
            }, duration * 1000);
        }
        
        // Начать игру
        function startGame() {
            let bet = parseInt(document.getElementById('bet').value);
            
            if (bet < 1000000) {
                showNotification('❌ Минимальная ставка 1,000,000₽', 2.5, true);
                return;
            }
            
            if (bet > 100000000) {
                showNotification('❌ Максимальная ставка 100,000,000₽', 2.5, true);
                return;
            }
            
            if (bet > balance) {
                showNotification('❌ Недостаточно средств!', 2.5, true);
                return;
            }
            
            currentBet = bet;
            
            console.log("🎮 Отправка ставки:", bet);
            tg.sendData(JSON.stringify({
                action: 'start_crash',
                bet: bet
            }));
            
            let crashChance = calculateWinChance(bet);
            
            if (Math.random() < crashChance) {
                crashPoint = 1.01;
            } else {
                crashPoint = generateCrashPoint();
            }
            
            startGameAnimation();
        }
        
        function generateCrashPoint() {
            let r = Math.random();
            if (r < 0.3) return 1.02 + Math.random() * 0.5;
            if (r < 0.6) return 1.52 + Math.random() * 1.0;
            if (r < 0.8) return 2.52 + Math.random() * 2.0;
            if (r < 0.95) return 4.52 + Math.random() * 3.0;
            return 7.52 + Math.random() * 2.48;
        }
        
        function startGameAnimation() {
            gameActive = true;
            currentMultiplier = 1.00;
            
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('cashoutBtn').style.display = 'block';
            document.getElementById('crashed').style.display = 'none';
            document.getElementById('multiplier').style.display = 'block';
            
            gameInterval = setInterval(function() {
                if (!gameActive) return;
                
                currentMultiplier += 0.01;
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
                
                if (currentMultiplier >= crashPoint) {
                    crash();
                }
            }, 100);
        }
        
        function crash() {
            gameActive = false;
            clearInterval(gameInterval);
            
            document.getElementById('multiplier').style.display = 'none';
            document.getElementById('crashed').style.display = 'block';
            document.getElementById('playBtn').style.display = 'block';
            document.getElementById('cashoutBtn').style.display = 'none';
            
            showNotification(`💥 КРАШ на ${crashPoint.toFixed(2)}x! Проигрыш: ${currentBet.toLocaleString()}₽`, 2.5, true);
            
            addToHistory('lose', currentBet, 0);
            
            setTimeout(requestBalance, 1000);
        }
        
        function cashout() {
            if (!gameActive) return;
            
            gameActive = false;
            clearInterval(gameInterval);
            
            let win = Math.floor(currentBet * currentMultiplier);
            
            console.log("💰 Отправка выигрыша:", win);
            tg.sendData(JSON.stringify({
                action: 'cashout_crash',
                win: win
            }));
            
            document.getElementById('playBtn').style.display = 'block';
            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('multiplier').style.display = 'block';
            
            showNotification(`🎉 ВЫИГРЫШ! +${win.toLocaleString()}₽ (${currentMultiplier.toFixed(2)}x)`, 2.5);
            
            addToHistory('win', currentBet, win);
            
            setTimeout(requestBalance, 1000);
        }
        
        function addToHistory(result, bet, win) {
            let historyDiv = document.getElementById('history');
            let historyItem = document.createElement('div');
            historyItem.className = `history-item history-${result}`;
            
            if (result === 'win') {
                historyItem.innerText = `✅ ${bet.toLocaleString()}₽ → +${win.toLocaleString()}₽`;
            } else {
                historyItem.innerText = `❌ ${bet.toLocaleString()}₽ → 0₽`;
            }
            
            historyDiv.prepend(historyItem);
            
            if (historyDiv.children.length > 5) {
                historyDiv.removeChild(historyDiv.lastChild);
            }
        }
    </script>
</body>
</html>
