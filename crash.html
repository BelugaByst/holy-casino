<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>💥 Crash Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #1a1a2e; color: white; padding: 20px; font-family: Arial;">
    <h1>🔧 ТЕСТОВЫЙ РЕЖИМ</h1>
    
    <div style="background: #16213e; padding: 20px; border-radius: 10px;">
        <h2>Баланс: <span id="balance">0</span> ₽</h2>
        <button onclick="testBalance()" style="padding: 10px; background: #00ff87;">🔄 Получить баланс</button>
        
        <div style="margin-top: 20px;">
            <h3>Ставка:</h3>
            <input type="number" id="bet" value="1000000" style="padding: 10px;">
            <button onclick="testBet()" style="padding: 10px; background: #22c55e;">🎮 Тест ставки</button>
        </div>
        
        <div style="margin-top: 20px;" id="log"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function addLog(text) {
            const log = document.getElementById('log');
            log.innerHTML = '<p style="color: #00ff87">✅ ' + text + '</p>' + log.innerHTML;
        }

        function testBalance() {
            addLog('📤 Отправляем запрос баланса...');
            tg.sendData(JSON.stringify({
                action: 'get_balance'
            }));
        }

        function testBet() {
            const bet = parseInt(document.getElementById('bet').value);
            addLog('📤 Отправляем ставку: ' + bet);
            tg.sendData(JSON.stringify({
                action: 'start_crash',
                bet: bet
            }));
        }

        // Слушаем ответы от бота
        tg.onEvent('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                addLog('📩 Получен ответ: ' + JSON.stringify(data));
                
                if (data.type === 'balance') {
                    document.getElementById('balance').innerText = data.balance;
                    addLog('💰 Баланс обновлен: ' + data.balance);
                } else if (data.type === 'error') {
                    addLog('❌ Ошибка: ' + data.message);
                }
            } catch(e) {
                addLog('❌ Ошибка парсинга: ' + e);
            }
        });

        // Запрашиваем баланс при загрузке
        setTimeout(testBalance, 1000);
    </script>
</body>
</html>
