<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dice Game</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<h1>🎲 Dice</h1>

Баланс: <span id="balance">0</span>

<input id="bet" type="number" placeholder="Ставка">

<button onclick="rollDice()">Бросить</button>

<h2 id="result"></h2>

<script src="app.js"></script>

<script>

function rollDice(){

let bet = parseInt(document.getElementById("bet").value)

if(!bet) return

let dice = Math.floor(Math.random()*6)+1 + Math.floor(Math.random()*6)+1

let win = 0

if(dice >= 8){

win = bet * 2

}

Telegram.WebApp.sendData(JSON.stringify({
action:"dice",
win:win,
bet:bet
}))


document.getElementById("result").innerText = "Кости: " + dice

}

</script>

</body>
</html>
